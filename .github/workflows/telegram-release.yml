name: Release and Push Handler

on:
  release:
    types: [published]
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Send release to Telegram
        if: github.event_name == 'release'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "@CamSwap"
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
        shell: bash
        run: python3 -c "import os,requests,sys;bot=os.environ['BOT_TOKEN'];cid=os.environ['CHAT_ID'];n=os.environ['RELEASE_NAME'];t=os.environ['RELEASE_TAG'];b=os.environ['RELEASE_BODY'];u=os.environ['RELEASE_URL'];r=os.environ['REPO'];m='New Release - '+r+'\\nRelease: '+n+' ('+t+')\\n\\n'+b+'\\n\\n'+u;requests.post('https://api.telegram.org/bot'+bot+'/sendMessage',data={'chat_id':cid,'text':m,'parse_mode':'HTML'},timeout=10).raise_for_status();print('OK')"
