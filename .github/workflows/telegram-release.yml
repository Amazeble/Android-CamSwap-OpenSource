name: Telegram Release Notification

on:
  release:
    types: [published]
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Send release to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "@CamSwap"
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 -c "import os,requests;bot=os.environ['BOT_TOKEN'];cid=os.environ['CHAT_ID'];n=os.environ['RELEASE_NAME'];t=os.environ['RELEASE_TAG'];b=os.environ['RELEASE_BODY'];u=os.environ['RELEASE_URL'];r=os.environ['REPO'];m=f'New Push - {r}\\nRelease: {n} ({t})\\n\\n{b}\\n\\n{u}';requests.post(f'https://api.telegram.org/bot{bot}/sendMessage',data={'chat_id':cid,'text':m,'parse_mode':'HTML'}).raise_for_status();print('OK')"
