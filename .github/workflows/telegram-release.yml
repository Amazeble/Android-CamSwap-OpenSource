name: Release and Push Handler

on:
  release:
    types: [published]
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Send release to Telegram
        if: github.event_name == 'release'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "@CamSwap"
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 << 'PYTHON_SCRIPT'
import os
import requests
import sys

bot_token = os.environ.get('BOT_TOKEN')
chat_id = os.environ.get('CHAT_ID')
release_name = os.environ.get('RELEASE_NAME', 'Unknown')
release_tag = os.environ.get('RELEASE_TAG', 'Unknown')
release_body = os.environ.get('RELEASE_BODY', '')
release_url = os.environ.get('RELEASE_URL', '')
repo = os.environ.get('REPO', 'Unknown')

if not bot_token or not chat_id:
    print('Missing BOT_TOKEN or CHAT_ID')
    sys.exit(0)

message = "New Release - " + repo + "\n"
message += "Release: " + release_name + " (" + release_tag + ")\n\n"
message += release_body + "\n\n"
message += release_url

try:
    response = requests.post(
        f'https://api.telegram.org/bot{bot_token}/sendMessage',
        data={'chat_id': chat_id, 'text': message, 'parse_mode': 'HTML'},
        timeout=10
    )
    response.raise_for_status()
    print('Telegram notification sent successfully')
except Exception as e:
    print(f'Failed to send Telegram notification: {e}')
    sys.exit(1)
PYTHON_SCRIPT
